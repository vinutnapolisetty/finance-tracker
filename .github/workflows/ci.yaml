name: Server smoke check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-smoke-check:
    name: Start API and check health
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install uvicorn

      # CI-only settings. Adjust these to match config.py.
      # Never put production credentials in this workflow.
      - name: Start FastAPI server
        env:
          ENVIRONMENT: test
        run: |
          nohup uvicorn app:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for server and check health endpoint
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              echo
              echo "Health endpoint is responding."
              exit 0
            fi

            if ! kill -0 "$(cat server.pid)" 2>/dev/null; then
              echo "Server process exited before becoming healthy."
              cat server.log
              exit 1
            fi

            sleep 2
          done

          echo "Server did not become healthy within 60 seconds."
          cat server.log
          exit 1

      - name: Check API schema endpoint
        run: curl --fail --silent http://127.0.0.1:8000/openapi.json > /dev/null

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" 2>/dev/null || true
          fi

      - name: Show server logs on failure
        if: failure()
        run: |
          if [ -f server.log ]; then
            cat server.log
          fi
